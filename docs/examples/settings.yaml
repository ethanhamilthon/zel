# ~/.config/zel/settings.yaml
model: openai/gpt-5   # PROVIDER/MODEL; the model menu writes here
effort: medium

settings:
  compaction: 400000
  bash_timeout: 30
  show_bash: true     # false hides the running command in the working line (time and steps stay)
  trace_hooks: true   # false: Tracing opens without the hook runs; Ctrl+H in Tracing toggles them
  bash_output: 8000   # bytes per bash call; longer output is cut, the full text goes to a file
  editor: nvim        # Ctrl+E opens the composer text in it

colors:
  accent: "#c3e88d"
  bg: "#1a1b26"
  trace:
    agent: "#e0e0e0"

provider:
  openai:
    base_url: https://api.openai.com/v1
    api: responses
    api_key: ${{ echo $OPENAI_API_KEY }}
  local:
    base_url: http://localhost:11434/v1
    api: chat
    api_key: ""
    modes: [headless]   # only zel -p sessions may use it

# Named systems, hooks and prompts live in the sibling directories.
