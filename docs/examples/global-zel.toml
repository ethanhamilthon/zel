# ~/.zel/zel.toml
provider = "openai"
model    = "gpt-5"
effort   = "medium"

instructions = [
  """
  Talk like a friend: short phrases, no filler.
  Use `zel choice` instead of asking questions in text; then end your turn.
  """,
  """
  ## Scripts (in PATH)
  - web-search <query> [-n 5] [--answer]   web search via Tavily
  """,
  { text = "You are a subagent: answer short, do not ask questions.", main = false, headless = true },
]

[settings]
compaction   = 400000
bash_timeout = 30
bash_output  = 8000     # bytes per bash call; longer output is cut, the full text goes to a file

[colors]
accent = "#c3e88d"
bg     = "#1a1b26"

[colors.trace]
agent = "#e0e0e0"

[providers.openai]
base_url = "https://api.openai.com/v1"
api      = "responses"
api_key  = "${{ echo $OPENAI_API_KEY }}"

[providers.local]
base_url = "http://localhost:11434/v1"
api      = "chat"
api_key  = ""

[hooks]
# a desktop notification when the agent is done and nothing runs any more
idle = [{ run = "osascript -e 'display notification \"zel is done\"' || true", async = true }]
# progress in the terminal tab (OSC 9;4: Ghostty, iTerm2, Windows Terminal); zel itself
# writes no title or progress. A turn stopped with Ctrl+D fires neither turn_end nor
# error, so its bar stays until the next turn ends.
turn_start     = ['printf "\033]9;4;3\a" > /dev/tty']
turn_end       = ['printf "\033]9;4;0\a" > /dev/tty']
error          = ['printf "\033]9;4;2;100\a" > /dev/tty']
session_closed = ['printf "\033]9;4;0\a" > /dev/tty']

[completions]
review = "Review the uncommitted changes:\n${{ git diff --stat }}"
